name: Home picture AI
version: "1.4.0"
slug: home_picture_ai
description: Looks at the pictures the TVs at home send it and says whether they're ads, for Home's ad screen.
url: https://github.com/TheEtheLaw/home-picture-ai
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
watchdog: "http://[HOST]:[PORT:8765]/status"
backup_exclude:
  - "*.onnx"
  - "*.part"
  - "*.tmp"
