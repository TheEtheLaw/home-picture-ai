configuration:
  format_new_drive:
    name: Format a new drive
    description: >-
      On the next start, erase the drive if it isn't this app's yet and format it for the app. It turns itself off
      once it has formatted one.
  keep_days:
    name: Days to keep
    description: >-
      A file nobody has played for this many days goes (the next episode waiting, one stopped partway, or a watched
      episode whose next one hasn't been played).
  film_hours:
    name: Hours to keep a watched film
    description: >-
      A film that's been watched stays this long after it was last played, to go back to (an episode that's been
      watched stays until a later one of its show is a fifth of the way in).
