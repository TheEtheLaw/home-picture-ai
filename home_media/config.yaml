name: Home media
version: "1.0.4"
slug: home_media
description: Downloads what Home plays onto its own USB drive and plays it to the TVs from there, so every jump is instant.
url: https://github.com/TheEtheLaw/home-picture-ai
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
full_access: true
privileged:
  - SYS_ADMIN
apparmor: false
hassio_api: true
watchdog: "http://[HOST]:[PORT:8766]/status"
options:
  format_new_drive: true
  keep_days: 8
schema:
  format_new_drive: bool
  keep_days: "int(1,30)"
